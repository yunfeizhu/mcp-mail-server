name: Bundle baseline

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bundle-baseline-main
  cancel-in-progress: true

jobs:
  baseline:
    if: github.repository == 'yunfeizhu/mcp-mail-server' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact trusted main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked main dependencies
        run: npm ci
      - name: Build the release bundle and offline Codecov statistics
        run: npm run build
        env:
          CODECOV_BUNDLE_ANALYSIS: 'true'
      - name: Upload the main baseline using GitHub OIDC
        run: npm run bundle:upload
