name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify and pack release
    if: github.repository == 'yunfeizhu/mcp-mail-server'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require a version tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo 'Run this workflow from a vX.Y.Z tag, not a branch.' >&2
            exit 1
          fi
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci
      - name: Verify tag, package versions, and release notes
        run: npm run release:verify -- "$GITHUB_REF_NAME"
      - name: Check formatting, lint, types, build, and tests
        run: npm run check
      - name: Pack verified source and record its checksum
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack --pack-destination "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          sha256sum *.tgz > SHA256SUMS
      - name: Upload the release package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-release-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish verified tarball
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/mcp-mail-server
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: release-package
    steps:
      - name: Download the verified release package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-package
          path: release-package
      - name: Verify the tarball checksum
        run: sha256sum --check SHA256SUMS
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install an OIDC-capable npm CLI
        run: npm install --global npm@11.17.0
      - name: Publish with npm trusted publishing
        run: >-
          npm publish "mcp-mail-server-${GITHUB_REF_NAME#v}.tgz"
          --access public --provenance --ignore-scripts
          --registry=https://registry.npmjs.org/
