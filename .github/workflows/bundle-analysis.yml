name: Bundle analysis

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: bundle-analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    if: github.repository == 'yunfeizhu/mcp-mail-server' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact head commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - name: Install locked head dependencies
        run: npm ci
      - name: Build the release bundle and offline Codecov statistics
        run: npm run build
        env:
          CODECOV_BUNDLE_ANALYSIS: 'true'
      - name: Check out the exact PR base commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: bundle-base
          persist-credentials: false
      - name: Build the baseline with its own lockfile
        working-directory: bundle-base
        run: |
          npm ci
          npm run build
      - name: Measure the two release bundles
        run: npm run bundle:report -- bundle-base/dist/index.js dist/index.js "$RUNNER_TEMP/bundle-report/report.json"
        env:
          BUNDLE_PR_NUMBER: ${{ github.event.pull_request.number }}
          BUNDLE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUNDLE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - name: Upload data for the separate comment workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-size-report-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bundle-report/report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload PR statistics to Codecov without a secret or OIDC permission
        run: npm run bundle:upload
